[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cproxy"
version = "1.1.0"
description = "User-level CLI for managing Mihomo proxy workflows"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "requests>=2", "tqdm>=4", "urllib3>=2.7.0", "idna>=3.15"]

[project.optional-dependencies]
tui = ["textual>=5.0"]

[project.scripts]
cproxy = "cproxy.cli:main"
cproxy-tui = "cproxy.tui_launcher:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"cproxy.tui" = ["styles.tcss"]
"cproxy" = ["data/completion/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 130

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# 测试要在 `import cproxy` 之前把仓库 src/ 插进 sys.path（见 tests/conftest.py），
# 所以那几个 import 必然不在文件顶部——结构使然，不是疏漏，整体豁免 E402。
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cproxy.tui.*"
disable_error_code = ["unused-coroutine", "attr-defined", "override"]
