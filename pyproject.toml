[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cproxy"
version = "0.1.0"
description = "User-level CLI for managing Mihomo proxy workflows"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "requests>=2", "tqdm>=4", "urllib3>=2.7.0", "idna>=3.15"]

[project.optional-dependencies]
tui = ["textual>=5.0"]

[project.scripts]
cproxy = "cproxy.cli:main"
cproxy-tui = "cproxy.tui.app:run_tui"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"cproxy.tui" = ["styles.tcss"]

[tool.setuptools.packages.find]
where = ["src"]
