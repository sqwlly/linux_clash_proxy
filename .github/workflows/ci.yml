name: ci

on:
  pull_request:
  push:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with TUI extra
        run: python -m pip install -e ".[tui]" pytest ruff mypy types-PyYAML

      - name: Lint
        run: ruff check src/

      - name: Type check
        run: mypy src/

      - name: Python tests
        run: PYTHONPATH="src:." python -m pytest -q

      - name: Shell tests
        run: |
          set -euo pipefail
          for test_script in tests/*.sh; do
            echo ">>> Running shell test: $test_script"
            if ! bash "$test_script"; then
              echo "Shell test failed: $test_script"
              exit 1
            fi
          done

      - name: Enterprise TUI audit
        run: bash "scripts/audit-enterprise-tui.sh"

      - name: GA artifact smoke
        run: |
          bash "scripts/build-ga-artifacts.sh" "/tmp/cproxy-ga"
          bash "scripts/verify-ga-artifacts.sh" "/tmp/cproxy-ga"

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit tools
        run: python -m pip install -e ".[tui]" pip-audit cyclonedx-bom

      - name: Dependency vulnerabilities
        run: |
          python -m pip freeze --exclude-editable > /tmp/cproxy-audit-requirements.txt
          pip-audit --strict -r /tmp/cproxy-audit-requirements.txt

      - name: SBOM
        run: cyclonedx-py environment --output-file sbom.cdx.json

      - name: Scorecard
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false
